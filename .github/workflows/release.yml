# Builds the desktop installers on every version tag (v*) and attaches them to a draft GitHub Release.
# The release stays a draft until it is published by hand, so nothing goes public by accident.
name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            files: release/*.exe
          - name: macOS
            os: macos-latest
            target: --mac
            files: release/*.dmg
          - name: Linux
            os: ubuntu-latest
            target: --linux
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The MCP brain end to end (private server, throwaway data). Platform-independent, so once is enough.
      - name: Brain smoke test
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/brain-smoke-test.mjs

      - run: npm run build

      - run: node scripts/build-desktop.mjs

      # Targets and architectures come from package.json ("build"). Naming a target here (e.g. --mac dmg)
      # would build only the runner's own architecture. Installers are unsigned: no certificate is configured.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Start the packaged app on this OS and check its server, defaults, bridge and UI.
      - name: Launch test
        run: node scripts/launch-test.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: installers/*
          generate_release_notes: true
